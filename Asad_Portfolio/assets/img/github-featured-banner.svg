<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" role="img" aria-label="asadbinjafor GitHub Projects">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15101f"/>
      <stop offset="50%" stop-color="#0d0d14"/>
      <stop offset="100%" stop-color="#0a0812"/>
    </linearGradient>
    <radialGradient id="glowL" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#8b6cef" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8b6cef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="85%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#9b7fe8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#9b7fe8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b5ce7"/>
      <stop offset="50%" stop-color="#9b7fe8"/>
      <stop offset="100%" stop-color="#6b5ce7"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect width="1200" height="627" fill="url(#glowL)"/>
  <rect width="1200" height="627" fill="url(#glowR)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#9b7fe8" stroke-width="1">
    <line x1="0" y1="104.5" x2="1200" y2="104.5"/>
    <line x1="0" y1="209" x2="1200" y2="209"/>
    <line x1="0" y1="313.5" x2="1200" y2="313.5"/>
    <line x1="0" y1="418" x2="1200" y2="418"/>
    <line x1="0" y1="522.5" x2="1200" y2="522.5"/>
    <line x1="200" y1="0" x2="200" y2="627"/>
    <line x1="400" y1="0" x2="400" y2="627"/>
    <line x1="600" y1="0" x2="600" y2="627"/>
    <line x1="800" y1="0" x2="800" y2="627"/>
    <line x1="1000" y1="0" x2="1000" y2="627"/>
  </g>

  <!-- Border frame -->
  <rect x="40" y="40" width="1120" height="547" rx="20" fill="none" stroke="#9b7fe8" stroke-opacity="0.18" stroke-width="1.5"/>
  <rect x="48" y="48" width="1104" height="531" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Accent line -->
  <rect x="450" y="118" width="300" height="3" rx="1.5" fill="url(#accent)" opacity="0.9"/>

  <!-- GitHub logo circle -->
  <circle cx="600" cy="178" r="42" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="600" cy="178" r="34" fill="#ffffff"/>
  <!-- Octocat simplified -->
  <g transform="translate(600,178)" fill="#0d0d14">
    <path d="M-14,-8 C-14,-16 -4,-20 0,-14 C4,-20 14,-16 14,-8 C14,2 8,8 0,12 C-8,8 -14,2 -14,-8 Z"/>
    <circle cx="-6" cy="-6" r="2.5"/>
    <circle cx="6" cy="-6" r="2.5"/>
    <path d="M-18,4 C-22,8 -20,14 -14,14 L-10,10" fill="none" stroke="#0d0d14" stroke-width="3" stroke-linecap="round"/>
    <path d="M18,4 C22,8 20,14 14,14 L10,10" fill="none" stroke="#0d0d14" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Username -->
  <text x="600" y="268" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="52" font-weight="700" letter-spacing="1">asadbinjafor</text>

  <!-- Subtitle -->
  <text x="600" y="318" text-anchor="middle" fill="#9b7fe8" font-family="Segoe UI, system-ui, sans-serif" font-size="24" font-weight="500" letter-spacing="0.5">Full-Stack Web � Java � C# � MySQL</text>

  <!-- Tech badges row -->
  <g transform="translate(600,400)">
    <!-- PHP -->
    <g transform="translate(-210,0)">
      <rect x="-58" y="-28" width="116" height="56" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#9b7fe8" stroke-opacity="0.25" stroke-width="1"/>
      <text x="0" y="8" text-anchor="middle" fill="#9b7fe8" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700">PHP</text>
    </g>
    <!-- MySQL -->
    <g transform="translate(-70,0)">
      <rect x="-58" y="-28" width="116" height="56" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#9b7fe8" stroke-opacity="0.25" stroke-width="1"/>
      <text x="0" y="6" text-anchor="middle" fill="#4479A1" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700">MySQL</text>
    </g>
    <!-- Java -->
    <g transform="translate(70,0)">
      <rect x="-58" y="-28" width="116" height="56" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#9b7fe8" stroke-opacity="0.25" stroke-width="1"/>
      <text x="0" y="6" text-anchor="middle" fill="#ED8B00" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700">Java</text>
    </g>
    <!-- Git -->
    <g transform="translate(210,0)">
      <rect x="-58" y="-28" width="116" height="56" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#9b7fe8" stroke-opacity="0.25" stroke-width="1"/>
      <text x="0" y="6" text-anchor="middle" fill="#F05032" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700">Git</text>
    </g>
  </g>

  <!-- Bottom tag -->
  <text x="600" y="520" text-anchor="middle" fill="#ffffff" fill-opacity="0.35" font-family="Segoe UI, system-ui, sans-serif" font-size="16" letter-spacing="2">GITHUB PROJECTS</text>

  <!-- Corner accents -->
  <path d="M40,90 L40,40 L90,40" fill="none" stroke="#9b7fe8" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M1110,40 L1160,40 L1160,90" fill="none" stroke="#9b7fe8" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M40,537 L40,587 L90,587" fill="none" stroke="#9b7fe8" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M1110,587 L1160,587 L1160,537" fill="none" stroke="#9b7fe8" stroke-opacity="0.4" stroke-width="2"/>
</svg>
