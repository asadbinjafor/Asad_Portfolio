<!DOCTYPE html>

<head>

   <meta name="description" content="Page not found — Mohammad Asad Bin Jafor Portfolio">
   <meta name="robots" content="noindex, follow">

   <link rel="stylesheet" href="assets/css/styles.css?v=59">
   <title>404 — Page Not Found | Asad Jafor</title>
   <script>
      (function () {
         var stored = localStorage.getItem('asad-portfolio-theme');
         var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
         document.documentElement.setAttribute('data-theme', theme);
      })();
   </script>
</head>

</body>
</html>
