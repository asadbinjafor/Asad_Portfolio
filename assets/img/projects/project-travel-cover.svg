<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="travel-title travel-desc">
  <title id="travel-title">Travel discovery and planning concept</title>
  <desc id="travel-desc">Concept cover based on verified project features</desc>
