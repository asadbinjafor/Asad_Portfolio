    <linearGradient id="travel-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080a13"/><stop offset="1" stop-color="#111329"/></linearGradient>
    <linearGradient id="travel-accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <radialGradient id="travel-glow"><stop stop-color="#22d3ee" stop-opacity=".32"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <filter id="travel-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".42"/></filter>
    <pattern id="travel-grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
    <clipPath id="travel-clip"><rect x="62" y="42" width="1076" height="591" rx="30"/></clipPath>
