<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="ftp-title ftp-desc">
  <title id="ftp-title">FTP media library and file transfer concept</title>
  <desc id="ftp-desc">Concept cover based on verified project features</desc>
  <defs>
    <linearGradient id="ftp-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080a13"/><stop offset="1" stop-color="#111329"/></linearGradient>
    <linearGradient id="ftp-accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="ftp-glow"><stop stop-color="#38bdf8" stop-opacity=".32"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <filter id="ftp-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".42"/></filter>
    <pattern id="ftp-grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
    <clipPath id="ftp-clip"><rect x="62" y="42" width="1076" height="591" rx="30"/></clipPath>
